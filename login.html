<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Dekuu</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body class="page-enter">
  <div class="cursor-glow" id="cursorGlow"></div>
  <nav id="mainNav">
    <div class="nav-inner container">
      <a class="brand" href="index.html"><span class="logo">DK</span><span>Dekuu</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a><a href="info.html">Info</a><a href="blog.html">Blog</a><a
          href="contact.html">Contact</a>
      </div>
      <div id="navAuth" class="nav-links"></div>
    </div>
  </nav>
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>

  <main class="container" style="padding-top:56px;max-width:520px">
    <div class="reveal">
      <span class="badge" style="margin-bottom:16px;display:inline-flex">🔐 Sign in</span>
      <h2 style="margin-bottom:4px">Welcome back</h2>
      <p style="margin-bottom:28px">Enter your details to access your account.</p>
    </div>
    <form id="l_form" class="form card reveal" style="transition-delay:.08s">
      <label>Email address
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input id="l_email" type="email" class="input" required placeholder="you@example.com">
        </div>
      </label>
      <label>Password
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input id="l_pass" type="password" class="input" required placeholder="••••••••">
        </div>
      </label>
      <button class="btn" type="submit" style="margin-top:4px">Sign in →</button>
      <div id="l_out" class="alert" style="margin-top:4px;display:none"></div>
    </form>
    <p class="help reveal" style="margin-top:16px;text-align:center;transition-delay:.14s">
      No account? <a href="signup.html" style="color:var(--prime-2);font-weight:600">Create one →</a>
    </p>
  </main>

  <footer>
    <div class="container">
      <div class="footer-inner">
        <span class="footer-brand">Dekuu</span>
        <span class="help">© 2025 Dekuu.</span>
      </div>
    </div>
  </footer>
  <script type="module" src="assets/app.js"></script>
  <script>
    const cg = document.getElementById('cursorGlow');
    document.addEventListener('mousemove', e => { cg.style.left = e.clientX + 'px'; cg.style.top = e.clientY + 'px'; });
    window.addEventListener('scroll', () => document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 20));
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const r = document.createElement('span'); r.className = 'ripple';
        const rect = btn.getBoundingClientRect(), size = Math.max(rect.width, rect.height);
        r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px`;
        btn.appendChild(r); setTimeout(() => r.remove(), 700);
      });
    });
    // Show/hide alert properly
    const origOut = document.getElementById('l_out');
    origOut.style.display = '';
  </script>
</body>

</html>
