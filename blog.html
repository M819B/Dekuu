<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — Dekuu</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body class="page-enter">
  <div class="cursor-glow" id="cursorGlow"></div>
  <nav id="mainNav">
    <div class="nav-inner container">
      <a class="brand" href="index.html"><span class="logo">DK</span><span>Dekuu</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a><a href="info.html">Info</a><a href="blog.html">Blog</a><a
          href="contact.html">Contact</a>
      </div>
      <div id="navAuth" class="nav-links"></div>
    </div>
  </nav>
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>

  <main class="container" style="padding-top:56px;max-width:800px">
    <div class="reveal">
      <span class="badge" style="margin-bottom:16px;display:inline-flex">📖 Latest posts</span>
      <h2 style="margin-bottom:4px">Blog</h2>
      <p style="margin-bottom:28px">Thoughts, updates and announcements from the Dekuu team.</p>
    </div>
    <section id="posts" class="posts reveal" style="transition-delay:.08s">
      <div class="skeleton" style="height:80px;margin-bottom:10px"></div>
      <div class="skeleton" style="height:80px;margin-bottom:10px;opacity:.7"></div>
      <div class="skeleton" style="height:80px;opacity:.4"></div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="footer-inner">
        <span class="footer-brand">Dekuu</span><span class="help">© 2025 Dekuu.</span>
      </div>
    </div>
  </footer>
  <script type="module" src="assets/app.js"></script>
  <script>
    const cg = document.getElementById('cursorGlow');
    document.addEventListener('mousemove', e => { cg.style.left = e.clientX + 'px'; cg.style.top = e.clientY + 'px'; });
    window.addEventListener('scroll', () => document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 20));
  </script>
</body>

</html>
