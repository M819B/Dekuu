<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Dekuu</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body class="page-enter">
  <div class="cursor-glow" id="cursorGlow"></div>
  <nav id="mainNav">
    <div class="nav-inner container">
      <a class="brand" href="index.html"><span class="logo">DK</span><span>Dekuu</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a><a href="info.html">Info</a><a href="blog.html">Blog</a><a
          href="contact.html">Contact</a>
      </div>
      <div id="navAuth" class="nav-links"></div>
    </div>
  </nav>
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>

  <main class="container" style="padding-top:56px;max-width:560px">
    <div class="reveal">
      <span class="badge" style="margin-bottom:16px;display:inline-flex">✨ Join Dekuu</span>
      <h2 style="margin-bottom:4px">Create your account</h2>
      <p style="margin-bottom:28px">Free forever. No credit card required.</p>
    </div>
    <form id="s_form" class="form card reveal" style="transition-delay:.08s">
      <label>Full name
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input id="s_name" type="text" class="input" required placeholder="Your name">
        </div>
      </label>
      <label>Email address
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input id="s_email" type="email" class="input" required placeholder="you@example.com">
        </div>
      </label>
      <label>Password
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input id="s_pass" type="password" class="input" required placeholder="Minimum 6 characters">
        </div>
      </label>
      <label>Confirm password
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input id="s_pass2" type="password" class="input" required placeholder="Repeat password">
        </div>
      </label>
      <button class="btn" type="submit" style="margin-top:4px">Create account →</button>
      <div id="s_out" class="alert" style="margin-top:4px"></div>
    </form>
    <p class="help reveal" style="margin-top:16px;text-align:center;transition-delay:.14s">
      Already have an account? <a href="login.html" style="color:var(--prime-2);font-weight:600">Sign in →</a>
    </p>
  </main>

  <footer>
    <div class="container">
      <div class="footer-inner">
        <span class="footer-brand">Dekuu</span>
        <span class="help">© 2025 Dekuu.</span>
      </div>
    </div>
  </footer>
  <script type="module" src="assets/app.js"></script>
  <script>
    const cg = document.getElementById('cursorGlow');
    document.addEventListener('mousemove', e => { cg.style.left = e.clientX + 'px'; cg.style.top = e.clientY + 'px'; });
    window.addEventListener('scroll', () => document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 20));
    document.querySelectorAll('.btn').forEach(btn => { btn.addEventListener('click', e => { const r = document.createElement('span'); r.className = 'ripple'; const rect = btn.getBoundingClientRect(), size = Math.max(rect.width, rect.height); r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px`; btn.appendChild(r); setTimeout(() => r.remove(), 700); }); });
  </script>
</body>

</html>
