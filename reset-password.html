<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Dekuu</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-enter">
<div class="cursor-glow" id="cursorGlow"></div>
<nav id="mainNav">
  <div class="nav-inner container">
    <a class="brand" href="index.html"><span class="logo">DK</span><span>Dekuu</span></a>
    <div id="navAuth" class="nav-links"></div>
  </div>
</nav>
<div class="bg-orb o1"></div><div class="bg-orb o2"></div>

<main class="container" style="padding-top:80px;max-width:420px">
  <div style="text-align:center;margin-bottom:32px">
    <span class="badge" style="margin-bottom:16px;display:inline-flex">🔐 Password Reset</span>
    <h2 style="margin-bottom:8px">Choose a new password</h2>
    <p style="color:var(--muted)">Enter and confirm your new password below.</p>
  </div>

  <div class="card" id="reset_card">
    <div id="reset_loading" style="text-align:center;padding:20px;color:var(--muted)">Verifying reset link…</div>
    
    <div id="reset_form" style="display:none;display:grid;gap:14px">
      <label>New password
        <input id="r_pass" type="password" class="input" placeholder="At least 6 characters" style="margin-top:4px">
      </label>
      <label>Confirm password
        <input id="r_pass2" type="password" class="input" placeholder="Repeat password" style="margin-top:4px">
      </label>
      <button id="r_submit" class="btn" type="button">Set new password →</button>
      <div id="r_out" class="alert" style="display:none"></div>
    </div>

    <div id="reset_invalid" style="display:none;text-align:center;padding:10px">
      <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
      <div style="font-weight:700;margin-bottom:8px">Invalid or expired link</div>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:20px">This password reset link has expired or already been used.</p>
      <a href="login.html" class="btn small">Back to Login</a>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyB8GwON5ncowfllNuvKi3FXW6op_9phMts",
  authDomain: "dekuu-8483c.firebaseapp.com",
  projectId: "dekuu-8483c",
  storageBucket: "dekuu-8483c.firebasestorage.app",
  messagingSenderId: "512811810672",
  appId: "1:512811810672:web:c3ec24c64a50d341d919b5"
});
const auth = getAuth(app);

// Get oobCode from URL
const params = new URLSearchParams(window.location.search);
const oobCode = params.get('oobCode');

const loading = document.getElementById('reset_loading');
const form = document.getElementById('reset_form');
const invalid = document.getElementById('reset_invalid');
const out = document.getElementById('r_out');

function showOut(msg, err=false) {
  out.style.display = 'block';
  out.className = 'alert ' + (err ? 'err' : 'ok');
  out.textContent = msg;
}

if(!oobCode) {
  loading.style.display = 'none';
  invalid.style.display = 'block';
} else {
  // Verify the code is valid
  verifyPasswordResetCode(auth, oobCode)
    .then(() => {
      loading.style.display = 'none';
      form.style.display = 'grid';
    })
    .catch(() => {
      loading.style.display = 'none';
      invalid.style.display = 'block';
    });
}

document.getElementById('r_submit').addEventListener('click', async () => {
  const pass = document.getElementById('r_pass').value;
  const pass2 = document.getElementById('r_pass2').value;
  if(!pass || pass.length < 6) return showOut('Password must be at least 6 characters.', true);
  if(pass !== pass2) return showOut('Passwords do not match.', true);
  try {
    await confirmPasswordReset(auth, oobCode, pass);
    showOut('✅ Password updated! Redirecting to login…');
    setTimeout(() => location.href = 'login.html', 2000);
  } catch(e) {
    showOut(e.message, true);
  }
});
</script>
<script>
const cg=document.getElementById('cursorGlow');
document.addEventListener('mousemove',e=>{cg.style.left=e.clientX+'px';cg.style.top=e.clientY+'px';});
window.addEventListener('scroll',()=>document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>20));
</script>
</body>
</html>
